<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Stroop-Test – KI-generiertes Lehrbeispiel</title>
<style>
*{box-sizing:border-box}body{font-family:system-ui,sans-serif;color:#172033;margin:0;padding:12px}main{max-width:1150px;margin:auto;background:#f5f7fb;border:1px solid #dbe2eb;border-radius:16px;padding:20px}h1{font-size:1.3rem;margin-top:0}h2{font-size:1.05rem}p{line-height:1.5}.layout{display:grid;grid-template-columns:minmax(270px,.85fr) minmax(320px,1.3fr);gap:18px;align-items:start}.card{background:white;border:1px solid #e1e6ef;border-radius:12px;padding:16px;margin-bottom:16px;min-width:0}.notice,.difference{display:block;background:#edf2f8;padding:12px;border-radius:8px;line-height:1.6}.notice{border-left:4px solid #2563eb}.scroll{max-height:400px;overflow:auto}table{border-collapse:collapse;width:100%;font-size:.9rem;font-variant-numeric:tabular-nums}th,td{padding:7px;border-bottom:1px solid #e5eaf1;text-align:right}thead th{background:#edf2f8}th:first-child{text-align:left}.raw tr:nth-child(even){background:#f8fafc}.note{font-size:.82rem;color:#526176}input{width:100%;min-width:0;padding:8px;border:1px solid #93a8c3;border-radius:6px;font:inherit}input:focus{outline:3px solid #bfdbfe}input[aria-invalid=true]{border-color:#b91c1c;background:#fff1f2}.error{color:#b91c1c;font-size:.85rem}button{padding:8px 10px;margin:10px 4px 0 0;background:white;border:1px solid #93a8c3;border-radius:6px;cursor:pointer;color:#172033}svg{width:100%;height:auto;display:block}.extra{background:#eff6ff}@media(max-width:760px){.layout{grid-template-columns:1fr}main{padding:12px}}
</style></head><body><main id="stroop"></main><script>
(()=>{'use strict';
const root=document.getElementById('stroop');
const base={"mit": [44.2, 40.6, 29.6, 39.9, 45.4, 41.2, 39.4, 44.2, 43.9, 46.9, 45.5, 33.7, 39.1, 31.1, 47.8, 32.1, 36.6, 44.2, 31.6, 39.5, 44.6, 43.1, 39.9, 36.3, 45.0, 46.5, 43.4, 36.5, 52.1, 35.7, 38.6, 43.8, 29.1, 36.9, 40.1, 56.9, 33.9, 39.2, 46.1, 40.5], "ohne": [41.1, 58.2, 47.4, 44.4, 51.1, 39.8, 39.5, 50.3, 41.7, 29.6, 42.6, 36.6, 36.0, 45.9, 48.4, 40.7, 43.3, 44.3, 37.7, 36.4, 52.0, 42.2, 44.8, 46.2, 30.6, 44.6, 42.4, 34.4, 47.6, 47.7, 40.5, 54.4, 50.0, 39.3, 45.9, 45.3, 42.6, 48.2, 38.9, 42.5]};
const groups=[{key:'mit',label:'Mit täglicher Sportstunde',color:'#2563eb'},{key:'ohne',label:'Ohne tägliche Sportstunde',color:'#d97706'}];
const fmt=(x,d=2)=>x.toLocaleString('de-DE',{minimumFractionDigits:d,maximumFractionDigits:d});
root.innerHTML=`<h1>Stroop-Test: mit und ohne tägliche Sportstunde</h1>
<p class="notice"><strong>Dieses Beispiel einschließlich der Ausgangsdaten ist KI-generiert.</strong> Die Daten sind simulierte Lehrdaten und keine real erhobenen Forschungsdaten. Es gibt 40 Ausgangswerte je Gruppe. Aus dem Beispiel lässt sich keine tatsächliche Wirkung täglicher Sportstunden ableiten.</p>
<div class="layout"><section class="card"><h2>Bearbeitungszeiten in Sekunden</h2><div class="scroll"><table><thead><tr><th scope="col">Mit täglicher Sportstunde (s)</th><th scope="col">Ohne tägliche Sportstunde (s)</th></tr></thead><tbody class="raw"></tbody></table></div><h2>Zusätzliche Personen</h2><table><thead><tr><th scope="col">Mit Sportstunde (s)</th><th scope="col">Ohne Sportstunde (s)</th></tr></thead><tbody class="extra"></tbody></table><button class="add" type="button">Weitere Eingabezeile</button><button class="reset" type="button">Zusatzwerte löschen</button><button class="csv" type="button">Aktuelle Daten als CSV</button><p class="note">Ergänze Werte und beobachte, wie sich die deskriptiven Kennwerte verändern. Zunächst stehen zwei Zusatzfelder je Gruppe bereit; weitere Eingabezeilen sind möglich. Jede gültige Eingabe zählt als zusätzliche Person. Nebeneinander stehende Werte sind keine Messpaare.</p><p class="error" role="status"></p></section><div><section class="card"><h2>Deskriptive Kennwerte</h2><div style="overflow:auto"><table><thead><tr><th scope="col">Kennwert</th><th scope="col">Mit Sportstunde</th><th scope="col">Ohne Sportstunde</th></tr></thead><tbody class="stats"></tbody></table></div><div class="difference" aria-live="polite"></div><p class="note">Zeitkennwerte in Sekunden, Varianz in s²; Anzahl ohne Einheit. Stichprobenvarianz und Stichprobenstandardabweichung werden mit dem Nenner n − 1 berechnet. Leere oder ungültige Zusatzfelder werden nicht berücksichtigt.</p></section><section class="card"><h2>Mittlere Bearbeitungszeit (M)</h2><div class="chart"></div><p class="note">Balken: Mittelwerte (M); Fehlerlinien: ± eine Stichprobenstandardabweichung (SD), keine Konfidenzintervalle. Die vertikale Achse beginnt bei 0.</p></section></div></div>`;
for(let i=0;i<base.mit.length;i++){const tr=document.createElement('tr');for(const g of groups){const td=document.createElement('td');td.textContent=fmt(base[g.key][i],1);tr.append(td)}root.querySelector('.raw').append(tr)}
let rowNumber=0;
function addRow(){rowNumber++;const tr=document.createElement('tr');for(const g of groups){const td=document.createElement('td'),input=document.createElement('input');input.type='text';input.inputMode='decimal';input.dataset.group=g.key;input.placeholder='Zusatzwert '+rowNumber;input.setAttribute('aria-label',g.label+': Zusatzwert '+rowNumber+' in Sekunden');input.setAttribute('aria-invalid','false');input.addEventListener('input',update);td.append(input);tr.append(td)}root.querySelector('.extra').append(tr)}
function getData(key){const values=[...base[key]];root.querySelectorAll('input[data-group="'+key+'"]').forEach(input=>{const s=input.value.trim();if(!s){input.setAttribute('aria-invalid','false');return}const v=Number(s.replace(',','.')),valid=/^[0-9]+([.,][0-9]+)?$/.test(s)&&Number.isFinite(v)&&v>0&&v<=600;input.setAttribute('aria-invalid',String(!valid));if(valid)values.push(v)});return values}
function statistics(v){const n=v.length,mean=v.reduce((s,x)=>s+x,0)/n,variance=v.reduce((s,x)=>s+(x-mean)**2,0)/(n-1),min=Math.min(...v),max=Math.max(...v);return {n,mean,variance,sd:Math.sqrt(variance),min,max,range:max-min}}
function chart(s){const baseY=265,top=35,ceiling=Math.max(60,Math.ceil(Math.max(...groups.map(g=>s[g.key].mean+s[g.key].sd))*1.1/10)*10),y=v=>baseY-(baseY-top)*v/ceiling;let svg='';for(let i=0;i<=5;i++){const v=ceiling*i/5;svg+=`<line x1="55" y1="${y(v)}" x2="555" y2="${y(v)}" stroke="#dbe2eb"/><text x="45" y="${y(v)+4}" text-anchor="end" font-size="12">${fmt(v,0)}</text>`}groups.forEach((g,i)=>{const r=s[g.key],x=190+230*i,hi=y(r.mean+r.sd),lo=y(Math.max(0,r.mean-r.sd));svg+=`<rect x="${x-42}" y="${y(r.mean)}" width="84" height="${baseY-y(r.mean)}" fill="${g.color}" rx="4"/><path d="M${x},${hi}V${lo} M${x-10},${hi}H${x+10} M${x-10},${lo}H${x+10}" stroke="#172033" stroke-width="2"/><text x="${x}" y="${hi-10}" text-anchor="middle" font-size="14">${fmt(r.mean)} s</text><text x="${x}" y="290" text-anchor="middle" font-size="13">${i?'Ohne tägliche':'Mit täglicher'}</text><text x="${x}" y="308" text-anchor="middle" font-size="13">Sportstunde</text><text x="${x}" y="330" text-anchor="middle" font-size="12">n = ${r.n}</text>`});root.querySelector('.chart').innerHTML=`<svg viewBox="0 0 580 350" role="img" aria-label="Mittlere Stroop-Bearbeitungszeiten und Standardabweichungen"><title>KI-generierte Stroop-Daten: Mittelwerte und Standardabweichungen</title><text x="55" y="16" font-size="12">Sekunden</text>${svg}</svg>`}
function update(){const s={mit:statistics(getData('mit')),ohne:statistics(getData('ohne'))};const metrics=[['Anzahl (n)','n',0],['Mittelwert (M)','mean',2],['Varianz (s²)','variance',2],['Standardabweichung (SD)','sd',2],['Minimum (Min.)','min',1],['Maximum (Max.)','max',1],['Spannweite (R)','range',1]];root.querySelector('.stats').innerHTML=metrics.map(([label,k,d])=>`<tr><th scope="row">${label}</th><td>${fmt(s.mit[k],d)}</td><td>${fmt(s.ohne[k],d)}</td></tr>`).join('');const difference=s.mit.mean-s.ohne.mean;root.querySelector('.difference').textContent='Mittelwertdifferenz (ΔM; mit − ohne): '+(difference>0?'+':'')+fmt(difference)+' s';root.querySelector('.error').textContent=root.querySelector('[aria-invalid="true"]')?'Bitte Zahlen größer als 0 und höchstens 600 eingeben, z. B. 42,5. Ungültige Werte werden nicht berücksichtigt.':'';chart(s)}
root.querySelector('.add').addEventListener('click',addRow);root.querySelector('.reset').addEventListener('click',()=>{root.querySelector('.extra').innerHTML='';rowNumber=0;addRow();addRow();update()});root.querySelector('.csv').addEventListener('click',()=>{const lines=['id;gruppe;stroop_zeit_s;herkunft'];let id=1;for(const g of groups){const values=getData(g.key);values.forEach((v,i)=>lines.push([id++,g.label,String(v).replace('.',','),i<base[g.key].length?'KI-generierte simulierte Lehrdaten':'Manuell ergänzter Lehrwert'].join(';')))}const url=URL.createObjectURL(new Blob(['\uFEFF'+lines.join('\n')],{type:'text/csv;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='stroop_40_aktuelle_daten.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)});addRow();addRow();update();
})();</script></body></html>
